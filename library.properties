name=ESP-Hive
version=1.0.0
author=Leonardo Mittmann
maintainer=Leonardo Mittmann
sentence=Distributed MPI-like computing cluster library for ESP32 with ESP-NOW and Wi-Fi.
paragraph=ESP-Hive turns multiple ESP32 boards into a coordinated distributed computing cluster. Features an MPI-like API (MPI_Send, MPI_Recv, MPI_Barrier, MPI_Bcast, MPI_Comm_rank, MPI_Comm_size), reliable packet transport over ESP-NOW (connectionless, low-overhead) or Wi-Fi UDP, automatic node discovery, task scheduling, FreeRTOS integration, and detailed network performance and packet loss statistics.
category=Communication
url=https://github.com/LeonardoMittmann/ESP-Hive
architectures=esp32
includes=ESPHive.h
